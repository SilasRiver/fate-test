    // ========== 计算干支 ==========
    function getGanzhi(year, month, day) {
        // 年干支
        var yearGan = (year - 4) % 10;
        var yearZhi = (year - 4) % 12;
        // 月干支（简化）
        var monthGan = (yearGan * 2 + month) % 10;
        var monthZhi = (month + 1) % 12;
        // 日干支（简化公式）
        var J = Math.floor(year / 100);
        var K = year % 100;
        var dayGanZhi = (J * 5 + Math.floor(J / 4) + K * 5 + Math.floor(K / 4) + Math.floor((month + 1) * 30.6 + day) - 3) % 60;
        var dayGan = dayGanZhi % 10;
        var dayZhi = dayGanZhi % 12;

        return {
            year: {gan: TIANGAN[yearGan], zhi: DIZHI[yearZhi], ganWX: TIANGAN_WUXING[yearGan], zhiWX: DIZHI_WUXING[yearZhi]},
            month: {gan: TIANGAN[monthGan], zhi: DIZHI[monthZhi], ganWX: TIANGAN_WUXING[monthGan], zhiWX: DIZHI_WUXING[monthZhi]},
            day: {gan: TIANGAN[dayGan], zhi: DIZHI[dayZhi], ganWX: TIANGAN_WUXING[dayGan], zhiWX: DIZHI_WUXING[dayZhi]}
        };
    }

    // 获取纳音五行
    function getNayin(year) {
        var idx = (year - 4) % 60;
        return {name: NAYIN[idx], wuxing: NAYIN_WUXING[idx]};
    }

    // ========== 梅花易数起卦（邵雍法） ==========
    function meihuaGua(year1, month1, day1, hour1, year2, month2, day2, hour2) {
        var now = new Date();
        var minute = now.getMinutes();
        var second = now.getSeconds();

        // 上卦 = (年+月+日) % 8，取先天八卦数
        var upperNum = (year1 + month1 + day1 + year2 + month2 + day2 + minute) % 8;
        if (upperNum === 0) upperNum = 8;

        // 下卦 = (年+月+日+时) % 8
        var lowerNum = (year1 + month1 + day1 + hour1 + year2 + month2 + day2 + hour2 + second) % 8;
        if (lowerNum === 0) lowerNum = 8;

        // 动爻 = (年+月+日+时+分+秒) % 6
        var changingYao = (year1 + month1 + day1 + hour1 + year2 + month2 + day2 + hour2 + minute + second) % 6;
        if (changingYao === 0) changingYao = 6;

        return {upperNum: upperNum, lowerNum: lowerNum, changingYao: changingYao};
    }

    // 生成变卦
    function getBiangua(upperNum, lowerNum, changingYao) {
        // 动爻在下卦（1-3爻）或上卦（4-6爻）
        var upperLines = getGuaLines(upperNum);
        var lowerLines = getGuaLines(lowerNum);

        if (changingYao <= 3) {
            // 动爻在下卦，变下卦
            lowerLines[changingYao - 1] = lowerLines[changingYao - 1] === 1 ? 0 : 1;
        } else {
            // 动爻在上卦，变上卦
            upperLines[changingYao - 4] = upperLines[changingYao - 4] === 1 ? 0 : 1;
        }

        var newUpper = linesToGuaNum(upperLines);
        var newLower = linesToGuaNum(lowerLines);

        return {upperNum: newUpper, lowerNum: newLower};
    }

    // 获取卦的六爻（1=阳，0=阴）
    function getGuaLines(num) {
        var lineMap = {
            1: [1,1,1], // 乾：阳阳阳
            2: [1,1,0], // 兑：阳阳阴
            3: [1,0,1], // 离：阳阴阳
            4: [1,0,0], // 震：阳阴阴
            5: [0,1,1], // 巽：阴阳阳
            6: [0,1,0], // 坎：阴阳阴
            7: [0,0,1], // 艮：阴阴阳
            8: [0,0,0]  // 坤：阴阴阴
        };
        return lineMap[num].slice();
    }

    // 三爻转卦数
    function linesToGuaNum(lines) {
        var lineMap = {
            '111':1,'110':2,'101':3,'100':4,'011':5,'010':6,'001':7,'000':8
        };
        return lineMap[lines.join('')];
    }

    // 五行关系
    function getWuxingRelation(wx1, wx2) {
        if (SHENG[wx1] === wx2) return '相生';
        if (KE[wx1] === wx2) return '相克';
        if (SHENG[wx2] === wx1) return '被生';
        if (KE[wx2] === wx1) return '被克';
        return '比和';
    }

            '被克':['多关注对方的优点和长处','学会包容和接纳彼此的不同','在困难时相互支持和鼓励','保持积极的心态，共同面对挑战'],
            '比和':['一起尝试新事物，保持新鲜感','共同学习和成长，互相激励','保持适当的个人空间','定期回顾和总结，共同进步']
        };
        document.getElementById('adviceContent').innerHTML='<ul>'+advices[relation].map(function(a){return '<li>'+a+'</li>'}).join('')+'</ul>';

        // 幸运
        document.getElementById('luckyColor').textContent=colors[(gua.upperNum+gua.lowerNum)%colors.length];
        document.getElementById('luckyNumber').textContent=((gua.upperNum+gua.lowerNum+gua.changingYao)%9)+1;
        document.getElementById('luckyDay').textContent=days[(d1+d2)%days.length];
        document.getElementById('luckyDirection').textContent=directions[(gua.upperNum+gua.lowerNum)%directions.length];

        // 最终
        var finals=[
            name1+'和'+name2+'，你们的缘分指数高达'+score+'分！'+hexInfo.meaning+'。记住，缘分是天注定，幸福靠自己。珍惜彼此，用心经营。',
            name1+'和'+name2+'，得卦'+hexInfo.name+'，'+hexInfo.meaning+'。每一段缘分都值得珍惜，愿你们相互理解、相互支持。',
            name1+'和'+name2+'，缘分让你们相遇。'+hexInfo.meaning+'。相信只要用心，一定能够收获美好的未来。'
        ];
        document.getElementById('finalAdvice').textContent=finals[Math.floor(Math.random()*finals.length)];

        window.scrollTo({top:0,behavior:'smooth'});
    }

    function goBack(){
        document.getElementById('inputSection').style.display='block';
        document.getElementById('resultSection').style.display='none';
        for(var i=1;i<=6;i++) document.getElementById('trait'+i).style.width='0%';
    }
    </script>
