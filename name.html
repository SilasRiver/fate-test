        .container {

            color: #666;
        }

        .input-section {

            padding: 30px;
            margin-bottom: 30px;
        }

        .person-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px dashed #e0e0e0;
        }

        .person-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .person-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .input-row {
            display: flex;

            margin-bottom: 15px;
        }

        .input-group {

        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;

            height: 45px;
            padding: 0 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s;
        }

        .date-select {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-select select {
            flex: 1;
            height: 45px;
            padding: 0 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            background: #fff;

            font-size: 20px;
            font-weight: bold;
            border: none;

            margin-top: 20px;

        }

        .btn:active {
            transform: translateY(0);
        }

        // 五行相生相克
        const wuxingSheng = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' };
        const wuxingKe = { '木': '土', '土': '水', '水': '火', '火': '金', '金': '木' };

        // 初始化日期选择器
        function initDateSelectors() {
            const currentYear = new Date().getFullYear();

            // 生成年份选项（1940-当前年）
            for (let i = currentYear; i >= 1940; i--) {
                const option1 = new Option(i, i);
                const option2 = new Option(i, i);
                document.getElementById('year1').add(option1);
                document.getElementById('year2').add(option2);
            }

            for (let i = 1; i <= 12; i++) {

                document.getElementById('month2').add(option2);
            }

            for (let i = 1; i <= 31; i++) {

        window.onload = function() {
            initDateSelectors();

        // 计算姓名值
        function getNameValue(name) {
            let value = 0;
            for (let i = 0; i < name.length; i++) {
                value += name.charCodeAt(i);
            }
            return value;
        }

        // 梅花易数起卦
        function meihuaGua(year1, month1, day1, hour1, year2, month2, day2, hour2) {
            const now = new Date();
            const minute = now.getMinutes();
            const second = now.getSeconds();

            // 上卦 = (人1年+月+日 + 人2年+月+日 + 分) % 8
            let upperNum = (year1 + month1 + day1 + year2 + month2 + day2 + minute) % 8;
            if (upperNum === 0) upperNum = 8;

            // 下卦 = (人1年+月+日+时 + 人2年+月+日+时 + 秒) % 8
            let lowerNum = (year1 + month1 + day1 + hour1 + year2 + month2 + day2 + hour2 + second) % 8;
            if (lowerNum === 0) lowerNum = 8;

            // 动爻 = (人1年+月+日+时 + 人2年+月+日+时 + 分+秒) % 6
            let changingYao = (year1 + month1 + day1 + hour1 + year2 + month2 + day2 + hour2 + minute + second) % 6;
            if (changingYao === 0) changingYao = 6;

            return { upperNum, lowerNum, changingYao };
        }

        // 计算五行关系
        function getWuxingRelation(wx1, wx2) {
            if (wuxingSheng[wx1] === wx2) return '相生';
            if (wuxingKe[wx1] === wx2) return '相克';
            if (wuxingSheng[wx2] === wx1) return '被生';
            if (wuxingKe[wx2] === wx1) return '被克';
            return '比和';
        }

        // 获取关系描述
        function getRelationDesc(relation, name1, name2, wx1, wx2) {
            const descs = {
                '相生': `${name1}（${wx1}）与${name2}（${wx2}）形成相生关系。这意味着你们之间有着天然的吸引力，${name1}的特质能够滋养${name2}，彼此能够相互促进、共同成长。这种关系中，双方都能从对方身上获得正能量。`,
                '相克': `${name1}（${wx1}）与${name2}（${wx2}）形成相克关系。这说明你们之间存在一定的张力和挑战，但这种张力也可以转化为动力。关键在于相互理解和包容，学会在差异中寻找平衡。`,
                '被生': `${name1}（${wx1}）与${name2}（${wx2}）形成被生关系。这意味着${name2}对${name1}有着强烈的吸引力，${name1}会不自觉地被${name2}所吸引。在这种关系中，${name2}往往扮演着引导者和支持者的角色。`,
                '被克': `${name1}（${wx1}）与${name2}（${wx2}）形成被克关系。这意味着你们之间存在一定的制约，但制约也是一种磨练。通过相互理解和调整，你们可以建立起独特而深刻的关系。`,
                '比和': `${name1}（${wx1}）与${name2}（${wx2}）形成比和关系。这意味着你们有着相似的特质和价值观，容易产生共鸣和默契。你们之间的关系往往比较和谐，能够相互理解和支持。`
            };
            return descs[relation];
        }

        // 主计算函数
        function calculate() {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();
            const year1 = document.getElementById('year1').value;
            const month1 = document.getElementById('month1').value;
            const day1 = document.getElementById('day1').value;
            const year2 = document.getElementById('year2').value;
            const month2 = document.getElementById('month2').value;
            const day2 = document.getElementById('day2').value;
            const hour1 = document.getElementById('hour1').value;
            const hour2 = document.getElementById('hour2').value;

            // 验证输入
            if (!name1) { alert('请输入第一个人的姓名'); return; }
            if (!name2) { alert('请输入第二个人的姓名'); return; }

            // 解析日期
            const date1 = { year: parseInt(year1), month: parseInt(month1), day: parseInt(day1) };
            const date2 = { year: parseInt(year2), month: parseInt(month2), day: parseInt(day2) };
            const h1 = hour1 ? parseInt(hour1) : 12;
            const h2 = hour2 ? parseInt(hour2) : 12;

            // 梅花易数起卦
            const gua = meihuaGua(date1.year, date1.month, date1.day, h1, date2.year, date2.month, date2.day, h2);

            // 获取卦象信息
            const upperGua = bagua[gua.upperNum - 1];
            const lowerGua = bagua[gua.lowerNum - 1];
            const hexKey = '' + gua.upperNum + gua.lowerNum;
            const hexInfo = hexagrams[hexKey] || { name: '未知卦', desc: '', meaning: '卦象不明' };

            // 五行关系
            const relation = getWuxingRelation(lowerGua.wuxing, upperGua.wuxing);
            const relationDesc = getRelationDesc(relation, name1, name2, lowerGua.wuxing, upperGua.wuxing);

            // 计算姓名值
            const value1 = getNameValue(name1);
            const value2 = getNameValue(name2);

            // 计算缘分指数
            const baseScore = gua.upperNum * 10 + gua.lowerNum * 8 + gua.changingYao * 12;
            const dateScore = (date1.year + date1.month + date1.day + date2.year + date2.month + date2.day) % 20;
            const nameScore = (value1 + value2) % 15;
            let score = ((baseScore + dateScore + nameScore) % 26) + 75;

            // 根据五行关系调整分数
            if (relation === '相生') score = Math.min(99, score + 5);
            else if (relation === '比和') score = Math.min(99, score + 3);
            else if (relation === '相克') score = Math.max(70, score - 3);

            // 计算各项特质
            const traits = {
                attraction: Math.min(98, Math.max(60, (score + value1 % 15 + gua.upperNum * 5) % 39 + 60)),
                tacit: Math.min(98, Math.max(60, (score + value2 % 12 + gua.lowerNum * 4) % 35 + 63)),
                stability: Math.min(98, Math.max(60, (score + gua.changingYao * 8 + dateScore) % 33 + 65)),
                growth: Math.min(98, Math.max(60, (score + (date1.year + date2.year) % 10) % 30 + 68)),
                happiness: Math.min(98, Math.max(60, (score + gua.upperNum + gua.lowerNum) % 28 + 70)),
                communication: Math.min(98, Math.max(60, (score + nameScore * 2) % 32 + 66))
            };

            // 缘分等级
            let level = '';
            let emoji = '';
            if (score >= 95) { level = '天作之合'; emoji = '💕✨'; }
            else if (score >= 90) { level = '情投意合'; emoji = '💕'; }
            else if (score >= 85) { level = '心有灵犀'; emoji = '💗'; }
            else if (score >= 80) { level = '相知相惜'; emoji = '💖'; }
            else if (score >= 75) { level = '默契十足'; emoji = '💓'; }
            else { level = '缘分初定'; emoji = '💘'; }

            // 相处模式分析
            const modes = {
                '相生': '你们的相处模式非常和谐，彼此能够相互滋养和支持。建议多一起做一些有意义的事情，共同成长。',
                '相克': '你们的相处模式充满活力，但也容易产生摩擦。建议多沟通、多理解，学会在冲突中寻找共识。',
                '被生': '你们的相处模式中，一方更主动，另一方更被动。建议主动的一方给予对方适当空间，被动的一方也要学会表达。',
                '被克': '你们的相处模式需要更多的耐心和包容。建议多关注对方的优点，学会欣赏彼此的不同。',
                '比和': '你们的相处模式非常默契，能够相互理解和支持。建议在稳定的基础上，适当增加一些新鲜感。'
            };

            // 相处建议
            const advices = {
                '相生': ['多一起参加户外活动，增进感情', '共同制定未来计划，增强默契', '在对方需要时给予支持和鼓励', '保持浪漫，定期制造小惊喜'],
                '相克': ['学会换位思考，理解对方立场', '在分歧时保持冷静，避免情绪化', '寻找共同兴趣，建立共同话题', '尊重彼此的个性和空间'],
                '被生': ['主动方要学会倾听和理解', '被动方要勇于表达自己的想法', '建立平等的沟通机制', '共同分担责任和义务'],
                '被克': ['多关注对方的优点和长处', '学会包容和接纳彼此的不同', '在困难时相互支持和鼓励', '保持积极的心态，共同面对挑战'],
                '比和': ['一起尝试新事物，保持新鲜感', '共同学习和成长，互相激励', '保持适当的个人空间', '定期回顾和总结，共同进步']
            };

            // 幸运元素
            const colors = ['红色', '蓝色', '绿色', '紫色', '橙色', '粉色', '金色', '白色'];
            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const directions = ['东方', '西方', '南方', '北方', '东南', '东北', '西南', '西北'];

            const luckyColor = colors[(gua.upperNum + gua.lowerNum) % colors.length];
            const luckyNumber = ((gua.upperNum + gua.lowerNum + gua.changingYao) % 9) + 1;
            const luckyDay = days[(date1.day + date2.day) % days.length];
            const luckyDirection = directions[(gua.upperNum + gua.lowerNum) % directions.length];

            // 最终建议
            const finalAdvices = [
                `${name1}和${name2}，你们的缘分指数高达${score}分！${hexInfo.meaning}。记住，缘分是天注定，幸福靠自己。珍惜彼此，用心经营，你们的未来一定会更加美好。`,
                `${name1}和${name2}，你们的缘分指数是${score}分。${hexInfo.meaning}。每一段缘分都值得珍惜，希望你们能够相互理解、相互支持，一起书写属于你们的故事。`,
                `${name1}和${name2}，缘分让你们相遇，而爱情需要双方共同浇灌。你们的缘分指数是${score}分，${hexInfo.meaning}。相信只要用心，一定能够收获美好的未来。`
            ];

            // 更新UI
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('coupleNames').textContent = `${name1} & ${name2}`;
            document.getElementById('scoreValue').textContent = `${score}分`;
            document.getElementById('levelText').textContent = level;

            // 基本信息
            document.getElementById('basicInfo').innerHTML = `
                <div class="info-item">
                    <div class="info-label">卦象</div>
                    <div class="info-value">${hexInfo.name}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">卦辞</div>
                    <div class="info-value">${hexInfo.desc}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">${name1}的属性</div>
                    <div class="info-value">${lowerGua.name}${lowerGua.nature}（${lowerGua.wuxing}）</div>
                </div>
                <div class="info-item">
                    <div class="info-label">${name2}的属性</div>
                    <div class="info-value">${upperGua.name}${upperGua.nature}（${upperGua.wuxing}）</div>
                </div>
            `;

            // 综合分析
            document.getElementById('overallAnalysis').innerHTML = `<p>${hexInfo.meaning}。从卦象来看，${name1}与${name2}的缘分有着深厚的根基，只要用心经营，定能收获美好的结果。</p>`;

            // 五行分析
            document.getElementById('wuxingContent').innerHTML = `<p>${relationDesc}</p>`;

            // 动画显示特质条
            setTimeout(() => { document.getElementById('trait1').style.width = traits.attraction + '%'; document.getElementById('trait1Value').textContent = traits.attraction + '%'; }, 200);
            setTimeout(() => { document.getElementById('trait2').style.width = traits.tacit + '%'; document.getElementById('trait2Value').textContent = traits.tacit + '%'; }, 400);
            setTimeout(() => { document.getElementById('trait3').style.width = traits.stability + '%'; document.getElementById('trait3Value').textContent = traits.stability + '%'; }, 600);
            setTimeout(() => { document.getElementById('trait4').style.width = traits.growth + '%'; document.getElementById('trait4Value').textContent = traits.growth + '%'; }, 800);
            setTimeout(() => { document.getElementById('trait5').style.width = traits.happiness + '%'; document.getElementById('trait5Value').textContent = traits.happiness + '%'; }, 1000);
            setTimeout(() => { document.getElementById('trait6').style.width = traits.communication + '%'; document.getElementById('trait6Value').textContent = traits.communication + '%'; }, 1200);

            // 相处模式
            document.getElementById('relationshipMode').innerHTML = `<p>${modes[relation]}</p>`;

            // 相处建议
            const adviceList = advices[relation];
            document.getElementById('adviceContent').innerHTML = '<ul>' + adviceList.map(a => `<li>${a}</li>`).join('') + '</ul>';

            // 幸运元素
            document.getElementById('luckyColor').textContent = luckyColor;
            document.getElementById('luckyNumber').textContent = luckyNumber;
            document.getElementById('luckyDay').textContent = luckyDay;
            document.getElementById('luckyDirection').textContent = luckyDirection;

            // 最终建议
            document.getElementById('finalAdvice').textContent = finalAdvices[Math.floor(Math.random() * finalAdvices.length)];

            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 返回
        function goBack() {
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('name1').value = '';
            document.getElementById('name2').value = '';
            document.getElementById('year1').value = '1990';
            document.getElementById('month1').value = '1';
            document.getElementById('day1').value = '1';
            document.getElementById('year2').value = '1990';
            document.getElementById('month2').value = '1';
            document.getElementById('day2').value = '1';
            document.getElementById('hour1').value = '';
            document.getElementById('hour2').value = '';

            // 重置动画
            for (let i = 1; i <= 6; i++) {
                document.getElementById('trait' + i).style.width = '0%';
            }
        }
